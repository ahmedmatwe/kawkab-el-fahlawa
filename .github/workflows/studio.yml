# Kawkab El Fahlawa studio — runs in the cloud (GitHub Actions); the Mac can be off.
# Every run: read Telegram replies → morning ideas (once a day) → advance every open episode.
name: studio

on:
  schedule:
    - cron: '17 */2 * * *'   # every 2 hours: keeps the private repo inside the free 2000 min/month
  workflow_dispatch:
    inputs:
      command:
        description: 'tick | morning'
        default: tick

concurrency:
  group: studio
  cancel-in-progress: false

permissions:
  contents: write   # save state on the `state` branch

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STUDIO_MODE: ${{ vars.STUDIO_MODE || 'production' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      EGY_TTS_TOKEN: ${{ secrets.EGY_TTS_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      VIDEO_PROVIDER: ${{ vars.VIDEO_PROVIDER || 'hf' }}
    steps:
      - name: Wait until Telegram is set up
        id: ready
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::notice::Telegram secrets missing — skipping (no minutes wasted)"; echo "go=0" >> "$GITHUB_OUTPUT"
          else echo "go=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == '1'
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == '1'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt && sudo apt-get -qq install -y ffmpeg >/dev/null
        if: steps.ready.outputs.go == '1'
      - run: scripts/state.sh load
        if: steps.ready.outputs.go == '1'
      - run: python -m studio ${{ inputs.command || 'tick' }}
        if: steps.ready.outputs.go == '1'
      - name: Save state
        if: always() && steps.ready.outputs.go == '1'
        run: scripts/state.sh save
      - name: Keep the videos for 7 days
        if: always() && steps.ready.outputs.go == '1'
        uses: actions/upload-artifact@v4
        with:
          name: episodes-${{ github.run_id }}
          path: data/episodes/*/final.mp4
          if-no-files-found: ignore
          retention-days: 7

  test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -q -r requirements.txt
      - run: STUDIO_MODE=demo python -m pytest -q
